[build-system]
requires = ["setuptools>=61.0", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "swizzle-kernels"
version = "0.2.0"
description = "Hardware-roofline fused CUDA, Triton, and TPU Pallas mega-kernels for Swizzle AI"
readme = "README.md"
authors = [{ name = "Paramveer singh", email = "paramveer@swizzle.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
triton = [
    "triton>=2.2.0"
]
tpu = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20"
]
test = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["swizzle_kernels*"]
